# Semantic Registry v1.0
# Only append; never overwrite.

event_types:

  task.created:
    current_semantic_version: 1.0
    meaning: "Initiates a new task with the user's original goal."
    introduced_at: 2026-05-16
    category: cognitive
    history:
      - version: 1.0
        meaning: "Initial definition."

  task.plan.generated:
    current_semantic_version: 1.0
    meaning: "Orchestrator produced a plan of subtasks and agent assignments."
    introduced_at: 2026-05-16
    category: cognitive
    history: [...]

  agent.call.started:
    current_semantic_version: 1.0
    meaning: "A single agent begins a reasoning cycle (may include multiple tool calls)."
    introduced_at: 2026-05-16
    category: mechanical
    history: [...]

  agent.call.completed:
    current_semantic_version: 1.0
    meaning: "Agent reasoning cycle finished, returning final output."
    introduced_at: 2026-05-16
    category: mechanical
    history: [...]

  tool.call.started:
    current_semantic_version: 1.0
    meaning: "Invocation of an external tool or function."
    introduced_at: 2026-05-16
    category: mechanical
    history: [...]

  tool.call.completed:
    current_semantic_version: 1.0
    meaning: "Tool execution finished, returning result."
    introduced_at: 2026-05-16
    category: mechanical
    history: [...]

  agent.error:
    current_semantic_version: 1.0
    meaning: "An agent encountered an error during execution."
    introduced_at: 2026-05-16
    category: mechanical
    history: [...]

  agent.recovery.attempt:
    current_semantic_version: 1.0
    meaning: "System attempted to recover from an error, either automatically or with human help."
    introduced_at: 2026-05-16
    category: mechanical
    history: [...]

  human.intervention:
    current_semantic_version: 1.0
    meaning: "Human provided feedback or correction to an agent."
    introduced_at: 2026-05-16
    category: governance
    history: [...]

  human.override:
    current_semantic_version: 1.0
        meaning: "人类显式覆盖 AI 输出。payload 必须包含 original_output, corrected_output, override_reason。中断因果链确定性。"
    introduced_at: 2026-05-16
    category: governance
    required_fields: [original_output, corrected_output, override_reason]
    history: [...]

  memory.updated:
    current_semantic_version: 1.0
    meaning: "A long-term memory entry was created or modified."
    introduced_at: 2026-05-16
    category: governance
    history: [...]

  task.completed:
    current_semantic_version: 1.0
    meaning: "Task successfully finished with final synthesized result."
    introduced_at: 2026-05-16
    category: cognitive
    history: [...]
